name: Integration Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  notify-send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 libnotify-bin python3-venv
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run integration test
        run: |
          dbus-run-session -- .venv/bin/python -m pytest -m integration tests/test_integration_notify_send.py
